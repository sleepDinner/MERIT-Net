seed: 42
output_dir: outputs/merit_net_s_768_stage3

data:
  train_root: /data0/lzb-change-vmunet/FinalTrainData/
  scan_output_dir: outputs
  img_size: 768
  split_ratio: 0.9
  balance_pos_neg: true
  num_workers: 16
  eval_num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  skip_invalid: true
  train_crop_mode: none
  crop_size: 768
  tamper_crop_prob: 0.7

model:
  name: MERITNet
  img_size: 768
  global_backbone: pvt_v2_b1
  global_pretrained: true
  local_backbone: light_resnet18
  srm_trainable: true
  decoder_embed_dim: 256
  use_residual_branch: true
  use_transformer_branch: true
  use_gated_fusion: true
  use_refinement: true
  use_confidence_head: true
  use_image_head: true
  use_family_head: false
  use_aux_outputs: true
  use_edge_loss: true
  num_families: 5
  gradient_checkpointing: true

train:
  epochs: 30
  batch_size_per_gpu: 8
  accumulate_grad_batches: 2
  compute_train_metrics: false
  train_metrics_mode: loss_only
  train_eval_batch_size_per_gpu: 8
  train_eval_max_batches: 50
  train_eval_interval: 5
  train_eval_first_epoch: true
  log_interval: 20
  amp: true
  optimizer: AdamW
  lr: 0.00002
  min_lr: 0.0000005
  weight_decay: 0.0001
  warmup_epochs: 2
  scheduler: cosine
  early_stopping:
    monitor: val_best_score
    mode: max
    patience: 8

checkpoint:
  save_every_epoch: true
  save_best_pth: false
  best_info_txt: best_checkpoint.txt
  latest_info_txt: latest_checkpoint.txt
  filename_template: epoch{epoch}.pth

loss:
  final_seg: 1.0
  coarse_seg: 0.4
  aux_seg: 0.15
  seg_bce: 1.0
  seg_dice: 1.0
  seg_focal: 0.25
  seg_tversky: 0.35
  focal_alpha: 0.75
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  edge: 0.2
  confidence: 0.2
  confidence_warmup_epochs: 0
  image: 0.3
  family: 0.0

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.2
  rotate_prob: 0.3
  jpeg_prob: 0.3
  jpeg_quality: [40, 95]
  noise_prob: 0.2
  noise_sigma: [0, 10]
  color_jitter_prob: 0.2
  color_jitter_strength: 0.12
  blur_prob: 0.08
  blur_radius: 1.0
  copy_move_prob: 0.2
  inpainting_prob: 0.2

augmentation_schedule:
  enabled: true
  mode: progressive
  warmup_epochs: 0
  max_strength_epoch: 20
  start:
    jpeg_prob: 0.25
    jpeg_quality_min: 60
    noise_prob: 0.15
    noise_sigma_max: 6
    copy_move_prob: 0.15
    inpainting_prob: 0.15
  end:
    jpeg_prob: 0.45
    jpeg_quality_min: 40
    noise_prob: 0.30
    noise_sigma_max: 10
    copy_move_prob: 0.30
    inpainting_prob: 0.30

eval:
  threshold: 0.5
  batch_size_per_gpu: 8
  save_predictions: true
  best_score:
    weights:
      val_best_pixel_f1: 0.5
      val_pixel_auc: 0.3
      val_boundary_f1: 0.2

ddp:
  backend: nccl
  find_unused_parameters: false
