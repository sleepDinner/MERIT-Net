seed: 42
output_dir: outputs/merit_net_s_768_pvtv2b2

data:
  train_root: /data0/lzb-change-vmunet/FinalTrainData/
  scan_output_dir: outputs
  img_size: 768
  split_ratio: 0.9
  balance_pos_neg: true
  split_strategy: source_aware
  force_resplit: false
  source_group_depth: 2
  min_val_groups: 2
  split_audit: true
  strict_pair_audit: true
  source_group_ignore_dirs:
    - images
    - image
    - imgs
    - masks
    - mask
    - gt
    - gts
    - groundtruth
    - ground_truth
    - labels
    - label
  num_workers: 16
  eval_num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  skip_invalid: true
  preprocess_mode: pad
  pad_position: top_left
  mask_threshold: 127
  train_crop_mode: mixed
  crop_size: 768
  tamper_crop_prob: 0.7
  crop_prob: 0.35

model:
  name: MERITNet
  img_size: 768
  global_backbone: pvt_v2_b2
  global_pretrained: true
  allow_global_fallback: false
  local_backbone: light_resnet18
  srm_trainable: true
  decoder_embed_dim: 192
  use_residual_branch: true
  use_transformer_branch: true
  use_gated_fusion: true
  use_refinement: true
  use_confidence_head: true
  use_image_head: true
  use_family_head: false
  use_logit_calibration: false
  use_aux_outputs: true
  use_edge_loss: true
  num_families: 5
  gradient_checkpointing: true

train:
  epochs: 80
  batch_size_per_gpu: 2
  accumulate_grad_batches: 2
  compute_train_metrics: false
  train_metrics_mode: loss_only
  train_eval_batch_size_per_gpu: 8
  train_eval_max_batches: 50
  train_eval_interval: 5
  train_eval_first_epoch: true
  log_interval: 20
  amp: true
  optimizer: AdamW
  lr: 0.00004
  min_lr: 0.000001
  weight_decay: 0.0001
  param_lr_multipliers:
    global_encoder: 0.35
  warmup_epochs: 3
  scheduler: cosine
  early_stopping:
    monitor: val_best_score
    mode: max
    patience: 10
    min_epochs: 12
    min_delta: 0.001
    loss_key: val_loss_final_seg
    loss_patience: 5
    loss_relative_tolerance: 0.22
    score_drop_patience: 5
    score_drop_tolerance: 0.04
    auc_key: val_pixel_auc
    auc_drop_patience: 5
    auc_drop_tolerance: 0.07

checkpoint:
  save_every_epoch: true
  save_best_pth: false
  best_info_txt: best_checkpoint.txt
  latest_info_txt: latest_checkpoint.txt
  filename_template: epoch{epoch}.pth

loss:
  final_seg: 1.0
  coarse_seg: 0.4
  aux_seg: 0.15
  seg_bce: 1.0
  seg_dice: 1.0
  seg_focal: 0.25
  seg_tversky: 0.35
  focal_alpha: 0.75
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  edge: 0.2
  confidence: 0.3
  confidence_warmup_epochs: 5
  image: 0.5
  family: 0.0

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.15
  rotate_prob: 0.15
  jpeg_prob: 0.05
  jpeg_quality: [90, 100]
  noise_prob: 0.0
  noise_sigma: [0, 0]
  color_jitter_prob: 0.1
  color_jitter_strength: 0.08
  blur_prob: 0.0
  blur_radius: [0.2, 0.8]
  downscale_prob: 0.0
  downscale_scale: [0.85, 0.98]
  copy_move_prob: 0.03
  inpainting_prob: 0.03

augmentation_schedule:
  enabled: true
  mode: phased
  warmup_ratio: 0.15
  robust_start_ratio: 0.50
  warmup_epochs: 10
  strong_aug_start_epoch: 40
  warmup:
    degradation_prob: 0.10
    max_degradations: 1
    jpeg_prob: 0.05
    jpeg_quality: [90, 100]
    blur_prob: 0.0
    blur_radius: [0.2, 0.8]
    noise_prob: 0.0
    noise_sigma: [0, 0]
    downscale_prob: 0.0
    color_jitter_prob: 0.10
    color_jitter_strength: 0.08
    scale_prob: 0.10
    scale_range: [0.90, 1.05]
    copy_move_prob: 0.03
    inpainting_prob: 0.03
  middle:
    degradation_prob: 0.20
    max_degradations: 1
    jpeg_prob: 0.18
    jpeg_quality: [75, 100]
    blur_prob: 0.08
    blur_radius: [0.2, 1.0]
    noise_prob: 0.08
    noise_sigma: [0, 5]
    downscale_prob: 0.08
    downscale_scale: [0.85, 0.98]
    color_jitter_prob: 0.15
    color_jitter_strength: 0.10
    scale_prob: 0.12
    scale_range: [0.90, 1.10]
    copy_move_prob: 0.06
    inpainting_prob: 0.06
  robust:
    degradation_prob: 0.35
    max_degradations: 2
    jpeg_prob: 0.28
    jpeg_quality: [50, 95]
    blur_prob: 0.12
    blur_radius: [0.2, 1.3]
    noise_prob: 0.12
    noise_sigma: [0, 8]
    downscale_prob: 0.12
    downscale_scale: [0.70, 0.95]
    color_jitter_prob: 0.18
    color_jitter_strength: 0.12
    scale_prob: 0.12
    scale_range: [0.90, 1.10]
    copy_move_prob: 0.10
    inpainting_prob: 0.10

eval:
  threshold: 0.5
  batch_size_per_gpu: 8
  max_pixel_auc_samples: 2000000
  pixel_auc_samples_per_image: 4096
  pixel_auc_seed: 42
  save_predictions: true
  best_score:
    weights:
      val_pixel_f1: 0.4
      val_best_pixel_f1: 0.3
      val_boundary_f1: 0.2
      val_pixel_auc: 0.1
    loss_guard:
      enabled: true
      loss_key: val_loss_final_seg
      relative_tolerance: 0.15
      penalty_weight: 0.5
  metrics:
    - pixel_f1
    - iou
    - pixel_auc
    - image_auc
    - balanced_accuracy
    - fpr

ddp:
  backend: nccl
  timeout_minutes: 180
  find_unused_parameters: false
